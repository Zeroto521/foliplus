name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Node jobs ──
  # Format, lint, and typecheck are independent of the Python matrix, so they
  # run as their own jobs rather than as steps inside `test`: they share no
  # dependency with it, they are the slow ones, and `make lint` is a
  # pre-commit run, which CI does not have. Each maps to one signal:
  #   format     — prettier reports a diff (never writes in CI)
  #   lint       — eslint pass 1, non-type-aware (the quality rules)
  #   typecheck  — tsc plus the type-aware Promise rules (both read tsconfig)
  # All shared bootstrap (Node pin, npm download cache, npm install, optional
  # Python + uv wheel cache) lives in .github/actions/setup-deps.
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps
      - run: npm run format:check

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps
      - run: npm run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps
      - run: npm run typecheck

  # ── CHANGELOG existence check (needs GITHUB_TOKEN) ──
  # Sort-order is enforced by pre-commit.ci (language: system, --fix mode).
  # This job only checks that every referenced #NNN exists as a real PR/issue.
  changelog:
    name: changelog
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request'
      && github.base_ref == 'main'
      && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      issues: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
      - run: python script/check/changelog_check.py --path CHANGELOG.md
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

  # ── Test jobs ──
  # `js`, `python`, and `browser` run independently in parallel — no artifact
  # handoff, and no `needs:` on the quality gates (format / lint / typecheck).
  # Tests are informational gates (we always want results, even when the
  # quality gates are red); the quality gates are separate checkmarks.
  # `make test-js` runs `build-js-dev + npm test` (some vitest tests read
  # `foliplus/dist/` artifacts — see `test/js/script/build/build.test.ts` and the
  # Makefile-invariant test in `test/js/script/Makefile.test.ts`).
  # `make test-python-fast` also builds internally before pytest. `python`
  # runs the non-browser suite on the version matrix; `browser` runs the
  # Playwright suite once (3.15 × folium latest). All entry points are the
  # same Makefile commands a developer runs locally, so CI drift stays
  # visible.
  js:
    name: js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps

      - run: make test-js

      - uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
          flags: ${{ job.name }}
      - uses: codecov/codecov-action@v7
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: test-js.junit.xml
          flags: ${{ job.name }}

  python:
    # Matrix-expanded per slot; codecov flags reference `job.name` so there is
    # one source of truth for the label.
    name: py${{ matrix.python }}-folium-${{ matrix.folium }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            folium: "0.15.0"
          - python: "3.15"
            folium: "latest"
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history needed for setuptools_scm to derive __version__ from tags.
          fetch-depth: 0
      - uses: ./.github/actions/setup-deps
        with:
          python-version: "${{ matrix.python }}"

      - run: uv sync --group test --upgrade-package "folium==${{ matrix.folium }}"
        if: ${{ matrix.folium != 'latest' }}
      - run: uv sync --group test
        if: ${{ matrix.folium == 'latest' }}
      - run: uv run make info

      # `make test-python-fast` builds `foliplus/dist/` internally and runs the
      # non-browser pytest suite (matrix = version compatibility). Browser
      # tests live in the `browser` job below (single cell) — see comment there.
      - run: uv run make test-python-fast

      - uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
          flags: ${{ job.name }}
      - uses: codecov/codecov-action@v7
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          flags: ${{ job.name }}

  browser:
    # Browser tests once (3.15 × folium latest), not on the matrix: they are
    # Playwright-bound, slow, and version-independent — running them twice buys
    # nothing. `make test-browser` is the same entry point a developer runs
    # locally. The CDN cache proxy in test/python/conftest.py serves folium's
    # Leaflet/jQuery/Bootstrap assets from /tmp/foliplus-cdn-cache (downloaded
    # once per job, retained via actions/cache so a re-run is network-independent
    # after the first download).
    name: browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history needed for setuptools_scm to derive __version__ from tags.
          fetch-depth: 0
      - uses: ./.github/actions/setup-deps
        with:
          python-version: "3.15"

      - run: uv sync --group test

      # Playwright browsers keyed by the resolved playwright version — no
      # lockfile needed, and `playwright install` still diffs against its own
      # browsers.json so a stale cache can never hide a required revision.
      - id: pwver
        name: Resolve Playwright version
        run: |
          version=$(uv run python -c 'import importlib.metadata as m; print(m.version("playwright"))')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pwver.outputs.version }}
          restore-keys: playwright-${{ runner.os }}-

      # Persist the CDN cache proxy's download dir across runs (see conftest).
      - uses: actions/cache@v6
        with:
          path: /tmp/foliplus-cdn-cache
          key: foliplus-cdn-cache-${{ runner.os }}-${{ hashFiles('foliplus/cdn.json') }}

      - run: uv run playwright install chromium
      - run: uv run make info

      - run: uv run make test-browser

      - uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
          flags: ${{ job.name }}
      - uses: codecov/codecov-action@v7
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: test-browser.junit.xml
          flags: ${{ job.name }}

  # Informational gate over the browser probe corpus (test/js/browser).
  # The `browser` job above runs the probes a Python test references; this job
  # validates the corpus itself (parse + reference inventory) and runs a bounded
  # headless-Chromium smoke. It is NOT a required check: `continue-on-error`
  # keeps a red run from blocking a PR, and the pass/fail summary lands in the
  # job summary plus the `browser-probe` artifact.
  browser-probe:
    name: browser-probe
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history needed for setuptools_scm to derive __version__ from tags.
          fetch-depth: 0
      - uses: ./.github/actions/setup-deps
        with:
          python-version: "3.15"

      - run: uv sync --group test

      - id: pwver
        name: Resolve Playwright version
        run: |
          version=$(uv run python -c 'import importlib.metadata as m; print(m.version("playwright"))')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pwver.outputs.version }}
          restore-keys: playwright-${{ runner.os }}-

      - run: uv run playwright install chromium

      # Smoke first, inventory last: a corpus gate failure is the job's verdict.
      - name: Headless Chromium smoke
        run: >
          uv run pytest -q -r a --color=yes -m browser
          test/python/infra/test_browser_probe_smoke.py
          -o junit_family=legacy --junitxml=browser-probe.junit.xml

      - name: Probe inventory + parse gate
        run: >
          node script/check/browser-probe.mjs --strict --github-summary
          --json browser-probe.json

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: browser-probe
          path: |
            browser-probe.json
            browser-probe.junit.xml
          if-no-files-found: ignore
