name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read
env:
  # Merge-queue changelog switch (see changelog job): 'true' runs the
  # order/existence check on merge_group (changelog is a required check);
  # 'false' skips it (PR-only informational). Read at step level — a job
  # `if` cannot see `env`.
  FOLIPLUS_CHANGELOG_MERGE_GROUP: "false"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Diff classification ──
  # One classifier job feeds the `if:` of every test job, so a documentation-only
  # pull request does not run the test suites. Only a diff that touches nothing
  # but documentation is skipped: the JS and Python halves are coupled (the
  # Python suite asserts on the built JS/CSS, the JS guards read the Python-emitted
  # config schema), so any code change runs both. A push or a merge-group run
  # reports code as changed (see the action), so the gates that must be complete
  # still are. `format` and `changelog` stay unconditional: they are cheap and
  # they cover the Markdown a docs-only change touches.
  classify:
    name: classify
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/classify-diff
        id: diff

  # ── Node jobs ──
  # Format, lint, and typecheck are independent of the Python matrix, so they
  # run as their own jobs rather than as steps inside `test`: they share no
  # dependency with it, they are the slow ones, and `make lint` is a
  # pre-commit run, which CI does not have. Each maps to one signal:
  #   format     — prettier reports a diff (never writes in CI)
  #   lint       — eslint pass 1, non-type-aware (the quality rules)
  #   typecheck  — tsc plus the type-aware Promise rules (both read tsconfig)
  # All shared bootstrap (Node pin, npm download cache, npm install, optional
  # Python + uv wheel cache) lives in .github/actions/setup-deps.
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps
      - run: npm run format:check

  # `lint` / `typecheck` / `js` / `python` / `browser` are required status checks, and
  # GitHub's ruleset does NOT accept a skipped required check: the pull request stays
  # BLOCKED, so a job-level `if:` would make every documentation-only PR unmergeable.
  # Those jobs therefore always run, and only their work steps are gated — a skipped
  # docs-only run costs the bootstrap and nothing else, and the check reports success.
  # `browser-probe` is not required, so it keeps the job-level skip.
  lint:
    name: lint
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps
      - run: npm run lint
        if: needs.classify.outputs.code == 'true'

      # ── pre-commit-only repo gates ──
      # These gate scripts live in .pre-commit-config.yaml and used to run only
      # through pre-commit.ci, which is not a required status check: a red gate
      # there did not block a merge. Run the same scripts directly on the
      # tracked files here (no pre-commit env reinstall), one step per signal.
      # Not duplicated because they already run in a required job:
      #   test-size        — npm run lint above (script/check/test-size.mjs)
      #                      and the vitest suite in the js job
      #   config-key-style — make config-schema-verify in the python job
      #                      (regenerate + byte-compare + dump key check)
      #   changelog-order  — the changelog job (check mode covers ordering)
      - uses: actions/setup-python@v7
        if: needs.classify.outputs.code == 'true'
        with:
          python-version: "3.15"

      # docstring_check imports docutils; codespell is pinned to the hook's rev.
      - name: Install gate dependencies
        if: needs.classify.outputs.code == 'true'
        run: python -m pip install --disable-pip-version-check codespell==2.4.3 docutils

      - name: style-check
        if: needs.classify.outputs.code == 'true'
        run: |
          git ls-files -z 'foliplus/js/*.ts' 'foliplus/css/*.css' 'foliplus/*.py' \
            'script/*.mjs' 'script/*.cjs' 'script/*.js' 'script/*.py' \
            'config/*.mjs' 'eslint.config.js' \
            | xargs -0 -n 100 -r python script/check/style_check.py

      - name: dead-barrel-export
        if: needs.classify.outputs.code == 'true'
        run: python script/check/dead_barrel_export.py

      - name: module-size-check
        if: needs.classify.outputs.code == 'true'
        run: python script/check/module_size_check.py

      - name: python-test-layout
        if: needs.classify.outputs.code == 'true'
        run: python script/check/python_test_layout.py

      - name: bare-reload
        if: needs.classify.outputs.code == 'true'
        run: python script/check/bare_reload.py

      - name: mojibake-check
        if: needs.classify.outputs.code == 'true'
        run: git grep -I -l -z -e '' | xargs -0 -n 100 -r python script/check/mojibake_check.py

      - name: docstring-check
        if: needs.classify.outputs.code == 'true'
        run: python script/check/docstring_check.py

      - name: codespell
        if: needs.classify.outputs.code == 'true'
        run: git grep -I -l -z -e '' | xargs -0 -n 200 -r codespell

  typecheck:
    name: typecheck
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps
      - run: npm run typecheck
        if: needs.classify.outputs.code == 'true'

  # ── CHANGELOG existence check (needs GITHUB_TOKEN) ──
  # Sort-order is enforced by pre-commit.ci (language: system, --fix mode).
  # This job only checks that every referenced #NNN exists as a real PR/issue.
  changelog:
    name: changelog
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'merge_group'
      || (
        github.event_name == 'pull_request'
        && github.base_ref == 'main'
        && github.event.pull_request.head.repo.full_name == github.repository
      )

    permissions:
      issues: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
      - name: Changelog invariants
        if: ${{ github.event_name != 'merge_group' || env.FOLIPLUS_CHANGELOG_MERGE_GROUP == 'true' }}
        run: python script/check/changelog_check.py --path CHANGELOG.md
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

  # ── Test jobs ──
  # `js`, `python`, and `browser` run independently in parallel — no artifact
  # handoff, and no `needs:` on the quality gates (format / lint / typecheck).
  # Tests are informational gates (we always want results, even when the
  # quality gates are red); the quality gates are separate checkmarks.
  # `make test-js` runs `build-js-dev + npm test` (some vitest tests read
  # `foliplus/dist/` artifacts — see `test/js/script/build/build.test.ts` and the
  # Makefile-invariant test in `test/js/script/Makefile.test.ts`).
  # `make test-python-fast` also builds internally before pytest. `python`
  # runs the non-browser suite on the version matrix; `browser` runs the
  # Playwright suite once (3.15 × folium latest). All entry points are the
  # same Makefile commands a developer runs locally, so CI drift stays
  # visible.
  js:
    name: js
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps

      - run: make test-js
        if: needs.classify.outputs.code == 'true'

      - uses: codecov/codecov-action@v7
        if: needs.classify.outputs.code == 'true'
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
          flags: ${{ job.name }}
      - uses: codecov/codecov-action@v7
        if: needs.classify.outputs.code == 'true' && !cancelled()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: test-js.junit.xml
          flags: ${{ job.name }}

  python:
    # Matrix-expanded per slot; codecov flags reference `job.name` so there is
    # one source of truth for the label.
    name: py${{ matrix.python }}-folium-${{ matrix.folium }}
    needs: classify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            folium: "0.15.0"
          - python: "3.15"
            folium: "latest"
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history needed for setuptools_scm to derive __version__ from tags.
          fetch-depth: 0
      - uses: ./.github/actions/setup-deps
        with:
          python-version: "${{ matrix.python }}"

      - run: uv sync --group test --upgrade-package "folium==${{ matrix.folium }}"
        if: ${{ matrix.folium != 'latest' }}
      - run: uv sync --group test
        if: ${{ matrix.folium == 'latest' }}
      - run: uv run make info

      # CONFIG contract gate: regenerate the schema from Python and assert the
      # committed `foliplus/js/config-schema.ts` is byte-identical (the file is
      # generated, never hand-edited), then check every contract key is
      # snake_case. Cheap (~2 s) and runs before the suite so a drift fails loud
      # instead of surfacing as a type mismatch.
      - run: uv run make config-schema-verify

      # `make test-python-fast` builds `foliplus/dist/` internally and runs the
      # non-browser pytest suite (matrix = version compatibility). Browser
      # tests live in the `browser` job below (single cell) — see comment there.
      - run: uv run make test-python-fast
        if: needs.classify.outputs.code == 'true'

      - uses: codecov/codecov-action@v7
        if: needs.classify.outputs.code == 'true'
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
          flags: ${{ job.name }}
      - uses: codecov/codecov-action@v7
        if: needs.classify.outputs.code == 'true' && !cancelled()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          flags: ${{ job.name }}

  browser:
    # Browser tests once (3.15 × folium latest), not on the matrix: they are
    # Playwright-bound, slow, and version-independent — running them twice buys
    # nothing. `make test-browser` is the same entry point a developer runs
    # locally. The CDN cache proxy in test/python/conftest.py serves folium's
    # Leaflet/jQuery/Bootstrap assets from /tmp/foliplus-cdn-cache (downloaded
    # once per job, retained via actions/cache so a re-run is network-independent
    # after the first download).
    name: browser
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history needed for setuptools_scm to derive __version__ from tags.
          fetch-depth: 0
      - uses: ./.github/actions/setup-deps
        with:
          python-version: "3.15"

      - run: uv sync --group test

      # Playwright browsers keyed by the resolved playwright version — no
      # lockfile needed, and `playwright install` still diffs against its own
      # browsers.json so a stale cache can never hide a required revision.
      - id: pwver
        name: Resolve Playwright version
        run: |
          version=$(uv run python -c 'import importlib.metadata as m; print(m.version("playwright"))')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pwver.outputs.version }}
          restore-keys: playwright-${{ runner.os }}-

      # Persist the CDN cache proxy's download dir across runs (see conftest).
      - uses: actions/cache@v6
        with:
          path: /tmp/foliplus-cdn-cache
          key: foliplus-cdn-cache-${{ runner.os }}-${{ hashFiles('foliplus/cdn.json') }}

      - run: uv run playwright install chromium
      - run: uv run make info

      - run: uv run make test-browser
        if: needs.classify.outputs.code == 'true'

      - uses: codecov/codecov-action@v7
        if: needs.classify.outputs.code == 'true'
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
          flags: ${{ job.name }}
      - uses: codecov/codecov-action@v7
        if: needs.classify.outputs.code == 'true' && !cancelled()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: test-browser.junit.xml
          flags: ${{ job.name }}

  # Informational gate over the browser probe corpus (test/js/browser).
  # The `browser` job above runs the probes a Python test references; this job
  # validates the corpus itself (parse + reference inventory) and runs a bounded
  # headless-Chromium smoke. It is NOT a required check: `continue-on-error`
  # keeps a red run from blocking a PR, and the pass/fail summary lands in the
  # job summary plus the `browser-probe` artifact.
  browser-probe:
    name: browser-probe
    needs: classify
    if: needs.classify.outputs.code == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history needed for setuptools_scm to derive __version__ from tags.
          fetch-depth: 0
      - uses: ./.github/actions/setup-deps
        with:
          python-version: "3.15"

      - run: uv sync --group test

      - id: pwver
        name: Resolve Playwright version
        run: |
          version=$(uv run python -c 'import importlib.metadata as m; print(m.version("playwright"))')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pwver.outputs.version }}
          restore-keys: playwright-${{ runner.os }}-

      - run: uv run playwright install chromium

      # Smoke first, inventory last: a corpus gate failure is the job's verdict.
      - name: Headless Chromium smoke
        run: >
          uv run pytest -q -r a --color=yes -m browser
          test/python/guard/test_browser_probe.py
          -o junit_family=legacy --junitxml=browser-probe.junit.xml

      - name: Probe inventory + parse gate
        run: >
          node script/check/browser-probe.mjs --strict --github-summary
          --json browser-probe.json

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: browser-probe
          path: |
            browser-probe.json
            browser-probe.junit.xml
          if-no-files-found: ignore
