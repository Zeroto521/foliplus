name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Node jobs ──
  # Format, lint, and typecheck are independent of the Python matrix, so they
  # run as their own jobs rather than as steps inside `test`: they share no
  # dependency with it, they are the slow ones, and `make lint` is a
  # pre-commit run, which CI does not have. Each maps to one signal:
  #   format     — prettier reports a diff (never writes in CI)
  #   lint       — eslint pass 1, non-type-aware (the quality rules)
  #   typecheck  — tsc plus the type-aware Promise rules (both read tsconfig)
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: "package.json"
          # setup-node auto-detects npm from the packageManager pin and turns on
          # package-manager caching, which requires a lockfile this repo ignores.
          package-manager-cache: false
      - run: npm install
      - run: npm run format:check

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: "package.json"
          # setup-node auto-detects npm from the packageManager pin and turns on
          # package-manager caching, which requires a lockfile this repo ignores.
          package-manager-cache: false
      - run: npm install
      - run: npm run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: "package.json"
          # setup-node auto-detects npm from the packageManager pin and turns on
          # package-manager caching, which requires a lockfile this repo ignores.
          package-manager-cache: false
      - run: npm install
      - run: npm run typecheck

  # ── PEP 561 consumer check ──
  # Builds the wheel, installs it into a scratch venv, and runs mypy from a
  # *downstream* script: with py.typed shipped, a Literal-bound constructor
  # argument ("method") must be flagged instead of the package being skipped.
  typed-consumer:
    name: typed-consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history needed for setuptools_scm to derive __version__ from tags.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5

      - run: uv build

      - name: install wheel + mypy into a scratch venv
        run: |
          uv venv /tmp/consumer
          # Pinned to the pre-commit hook's mypy rev for a deterministic gate.
          uv pip install --python /tmp/consumer/bin/python dist/*.whl "mypy==2.3.1"

      - name: assert a downstream mypy catches a Literal mismatch
        run: |
          cat > /tmp/consumer/consumer.py <<'EOF'
          from foliplus import HeatmapControl, LocaleConfig

          HeatmapControl(method="quantile")  # valid — must not be flagged
          HeatmapControl(method="bogus")  # invalid — mypy must flag it
          EOF
          set +e
          /tmp/consumer/bin/mypy /tmp/consumer/consumer.py > /tmp/consumer/mypy.out 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            cat /tmp/consumer/mypy.out
            echo "expected mypy to fail on HeatmapControl(method='bogus')"
            exit 1
          fi
          grep -q "Literal" /tmp/consumer/mypy.out || {
            cat /tmp/consumer/mypy.out
            echo "expected a Literal mismatch, got a different error"
            exit 1
          }

  test:
    name: py${{ matrix.python }}-folium-${{ matrix.folium }}
    runs-on: ubuntu-latest
    needs: [format, lint, typecheck]
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            folium: "0.14.0"
          - python: "3.14"
            folium: "latest"
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history needed for setuptools_scm to derive __version__ from tags.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "${{ matrix.python }}"
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: "package.json"
          # setup-node auto-detects npm from the packageManager pin and turns on
          # package-manager caching, which requires a lockfile this repo ignores.
          package-manager-cache: false
      - run: npm install

      - run: uv sync --group test --upgrade-package "folium==${{ matrix.folium }}"
        if: ${{ matrix.folium != 'latest' }}
      - run: uv sync --group test
        if: ${{ matrix.folium == 'latest' }}
      - run: uv run playwright install chromium
      - run: uv run make info
      - run: uv run make test

      - uses: codecov/codecov-action@v6
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
      - uses: codecov/codecov-action@v6
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          flags: py${{ matrix.python }}-folium-${{ matrix.folium }}
