name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python }}-folium-${{ matrix.folium }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            folium: "0.14.0"
          - python: "3.14"
            folium: "latest"
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history needed for setuptools_scm to derive __version__ from tags.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "${{ matrix.python }}"
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: "package.json"

      - run: npm install
      - run: npm run typecheck

      - run: uv sync --group test --upgrade-package "folium==${{ matrix.folium }}"
        if: ${{ matrix.folium != 'latest' }}
      - run: uv sync --group test
        if: ${{ matrix.folium == 'latest' }}
      - run: uv run playwright install chromium
      - run: uv run make info
      - run: uv run make test

      - uses: codecov/codecov-action@v6
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
      - uses: codecov/codecov-action@v6
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          flags: py${{ matrix.python }}-folium-${{ matrix.folium }}

  size-check:
    name: bundle-size
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # to post/update the PR size comment
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: "package.json"
      - run: npm install
      # build:sonda builds and generates reports in one pass, avoiding a duplicate build with size:check
      - run: npm run build:sonda
      - run: npm run size:check
      # Compare this PR's bundles against the base branch's committed baseline and
      # post the diff as a sticky PR comment (updated on every push). The gate
      # above uses the PR's own baseline; this diff is informational.
      - name: Prepare size report vs base
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          git show "origin/${{ github.base_ref }}:size-baseline.json" > base-baseline.json 2>/dev/null || echo '{"files":{}}' > base-baseline.json
          node script/size-check.mjs --baseline=base-baseline.json --report=size-report.md || true
      - name: Comment bundle size changes on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true # fork PRs lack comment permission
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: bundle-size
          path: size-report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-reports
          path: bundle-reports/
