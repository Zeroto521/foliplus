name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Node jobs ──
  # Format, lint, and typecheck are independent of the Python matrix, so they
  # run as their own jobs rather than as steps inside `test`: they share no
  # dependency with it, they are the slow ones, and `make lint` is a
  # pre-commit run, which CI does not have. Each maps to one signal:
  #   format     — prettier reports a diff (never writes in CI)
  #   lint       — eslint pass 1, non-type-aware (the quality rules)
  #   typecheck  — tsc plus the type-aware Promise rules (both read tsconfig)
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: "package.json"
          # setup-node auto-detects npm from the packageManager pin and turns on
          # package-manager caching, which requires a lockfile this repo ignores.
          package-manager-cache: false
      - run: npm install
      - run: npm run format:check

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: "package.json"
          # setup-node auto-detects npm from the packageManager pin and turns on
          # package-manager caching, which requires a lockfile this repo ignores.
          package-manager-cache: false
      - run: npm install
      - run: npm run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: "package.json"
          # setup-node auto-detects npm from the packageManager pin and turns on
          # package-manager caching, which requires a lockfile this repo ignores.
          package-manager-cache: false
      - run: npm install
      - run: npm run typecheck

  # Test-suite typecheck — mirrors `typecheck` but runs the separate program at
  # test/js/tsconfig.json, which extends the root program and adds the vitest
  # globals + node types the tests need. Split into its own job because the
  # programs have different `types`/`paths`, and because the test program is
  # still carrying measured typing debt that is being cleared in batches; the
  # gate is wired up first, flipped from `continue-on-error` to a real red
  # signal once the remaining errors reach zero. That flip is deliberate, not
  # automatic: dropping `continue-on-error` while the program is still red
  # would break CI, so it has to be a coordinated last step.
  typecheck-tests:
    name: typecheck-tests
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: "package.json"
          # setup-node auto-detects npm from the packageManager pin and turns on
          # package-manager caching, which requires a lockfile this repo ignores.
          package-manager-cache: false
      - run: npm install
      - run: npm run typecheck:tests

  # ── CHANGELOG existence check (needs GITHUB_TOKEN) ──
  # Sort-order is enforced by pre-commit.ci (language: system, --fix mode).
  # This job only checks that every referenced #NNN exists as a real PR/issue.
  changelog-exists:
    name: changelog-exists
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request'
      && github.base_ref == 'main'
      && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      issues: read
    steps:
      - uses: actions/checkout@v6
      - run: python script/changelog_check.py --path CHANGELOG.md
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'

  test:
    name: py${{ matrix.python }}-folium-${{ matrix.folium }}
    runs-on: ubuntu-latest
    needs: [format, lint, typecheck, typecheck-tests]
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            folium: "0.14.0"
          - python: "3.14"
            folium: "latest"
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history needed for setuptools_scm to derive __version__ from tags.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "${{ matrix.python }}"
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: "package.json"
          # setup-node auto-detects npm from the packageManager pin and turns on
          # package-manager caching, which requires a lockfile this repo ignores.
          package-manager-cache: false
      - run: npm install

      - run: uv sync --group test --upgrade-package "folium==${{ matrix.folium }}"
        if: ${{ matrix.folium != 'latest' }}
      - run: uv sync --group test
        if: ${{ matrix.folium == 'latest' }}
      - run: uv run playwright install chromium
      - run: uv run make info

      - run: uv run make test

      - uses: codecov/codecov-action@v6
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
      - uses: codecov/codecov-action@v6
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          flags: py${{ matrix.python }}-folium-${{ matrix.folium }}
