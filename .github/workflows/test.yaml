name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Node jobs ──
  # Format, lint, and typecheck are independent of the Python matrix, so they
  # run as their own jobs rather than as steps inside `test`: they share no
  # dependency with it, they are the slow ones, and `make lint` is a
  # pre-commit run, which CI does not have. Each maps to one signal:
  #   format     — prettier reports a diff (never writes in CI)
  #   lint       — eslint pass 1, non-type-aware (the quality rules)
  #   typecheck  — tsc plus the type-aware Promise rules (both read tsconfig)
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: "package.json"
          # setup-node auto-detects npm from the packageManager pin and turns on
          # package-manager caching, which requires a lockfile this repo ignores.
          package-manager-cache: false
      - run: npm install
      - run: npm run format:check

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: "package.json"
          # setup-node auto-detects npm from the packageManager pin and turns on
          # package-manager caching, which requires a lockfile this repo ignores.
          package-manager-cache: false
      - run: npm install
      - run: npm run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: "package.json"
          # setup-node auto-detects npm from the packageManager pin and turns on
          # package-manager caching, which requires a lockfile this repo ignores.
          package-manager-cache: false
      - run: npm install
      - run: npm run typecheck

  test:
    name: py${{ matrix.python }}-folium-${{ matrix.folium }}
    runs-on: ubuntu-latest
    needs: [format, lint, typecheck]
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            folium: "0.14.0"
          - python: "3.14"
            folium: "latest"
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history needed for setuptools_scm to derive __version__ from tags.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "${{ matrix.python }}"
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: "package.json"
          # setup-node auto-detects npm from the packageManager pin and turns on
          # package-manager caching, which requires a lockfile this repo ignores.
          package-manager-cache: false
      - run: npm install

      - run: uv sync --group test --upgrade-package "folium==${{ matrix.folium }}"
        if: ${{ matrix.folium != 'latest' }}
      - run: uv sync --group test
        if: ${{ matrix.folium == 'latest' }}
      - run: uv run playwright install chromium
      - run: uv run make info

      # Bundle size gates — measure the minified artifacts (the bytes that
      # actually ship), not the dev build that `make test` produces below.
      #
      # Two gates, split by responsibility:
      #   bundle-fuse.mjs       — absolute cap per artifact. Loose (~2x
      #                           current), the fuse that fires only on
      #                           tens-of-KB incidents. Comments never
      #                           count because the read is off the minified
      #                           artifact, not the source.
      #   bundle-size-check.mjs — relative delta against the merge base.
      #                           Fires on +10% growth that also exceeds
      #                           128 B brotli.
      #
      # We use `git merge-base HEAD origin/<base>` rather than the base
      # branch's current tip: the tip drifts as other PRs land, so diffing
      # against it would mix their size changes into ours. The merge base is
      # the commit this branch forked from, i.e. the reference we actually
      # started from.
      #
      # `base-sizes.json` lives at the repo root for the whole workflow so
      # both gates and the `uv run make test` below can see it. When the
      # base_ref has no commit yet (unusual) the emit step exits 0 and
      # leaves no file — the enforce step below then reports skipped
      # explicitly rather than pretending it passed.
      - name: Capture base bundle sizes
        run: |
          base_ref="origin/${{ github.base_ref }}"
          if ! git rev-parse -q --verify "$base_ref" >/dev/null; then
            echo "No base ref available — skipping capture."
            exit 0
          fi
          base_sha=$(git merge-base HEAD "$base_ref")
          git worktree add --detach /tmp/base "$base_sha"
          ln -s "$(pwd)/node_modules" /tmp/base/node_modules
          (
            cd /tmp/base
            npm run build
          )
          node script/bundle-size-check.mjs --root=/tmp/base --emit=base-sizes.json
          git worktree remove --force /tmp/base

      - name: Build minified bundles for size gates
        run: npm run build

      - name: Bundle size gates
        run: |
          node script/bundle-fuse.mjs
          if [ -f base-sizes.json ]; then
            node script/bundle-size-check.mjs --baseline=base-sizes.json --enforce
          else
            node script/bundle-size-check.mjs --enforce
          fi

      - run: uv run make test

      - uses: codecov/codecov-action@v6
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
      - uses: codecov/codecov-action@v6
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          flags: py${{ matrix.python }}-folium-${{ matrix.folium }}
