name: release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  sdist:
    if: >-
      ${{
        github.event_name == 'pull_request' ||
        (
          github.event_name == 'push' &&
          (
            github.ref == 'refs/heads/main' ||
            startsWith(github.ref, 'refs/tags/v')
          )
        )
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Keep tags/history available for setuptools_scm versioning
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: "package.json"
          # setup-node auto-detects npm from the packageManager pin and turns on
          # package-manager caching, which requires a lockfile this repo ignores.
          package-manager-cache: false

      - run: npm install

      - name: Build dist for main TestPyPI (.postN)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          SETUPTOOLS_SCM_OVERRIDES_FOR_FOLIPLUS: '{version_scheme="post-release", local_scheme="no-local-version"}'
        run: make dist

      - name: Build dist for PR/tag (default versioning)
        if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        run: make dist

      - run: pip install dist/*.whl

      - name: Smoke-test the installed wheel
        run: |
          # `foliplus/dist` is gitignored, so a bad build yields a wheel that
          # installs and imports cleanly but renders maps with no controls.
          # Render every control against the freshly installed copy.
          # `add_to` swaps the map's root for a Figure, so render through
          # `get_root()`.
          python - <<'PY'
          import folium
          import foliplus

          names = [
              n for n in dir(foliplus)
              if n.endswith("Control")
              and n != "BaseControl"
              and isinstance(getattr(foliplus, n), type)
          ]
          assert names, "no control classes exported"

          for name in sorted(names):
              m = folium.Map(location=[40.4, -3.7])
              getattr(foliplus, name)().add_to(m)
              html = m.get_root().render()
              assert "foliplus" in html, f"{name}: shared bundle not emitted"
          print(f"rendered {len(names)} controls: {', '.join(sorted(names))}")
          PY

      - run: make info

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: dist/

  TestPyPI:
    needs: sdist
    if: >-
      ${{
        github.event_name == 'push' &&
        (
          github.ref == 'refs/heads/main' ||
          startsWith(github.ref, 'refs/tags/v')
        )
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release*
          merge-multiple: true
          path: dist/

      - run: ls dist/ -l

      - uses: pypa/gh-action-pypi-publish@v1.14.0
        with:
          user: __token__
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          verbose: true

  PyPI:
    needs: TestPyPI
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: dist/

      - run: ls dist/ -l

      - uses: pypa/gh-action-pypi-publish@v1.14.0
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          verbose: true

  GitHub:
    needs: sdist
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: dist/

      - run: ls dist/ -l

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref, 'rc') }}
          files: dist/*.tar.gz
