name: release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  sdist:
    if: >-
      ${{
        github.event_name == 'pull_request' ||
        (
          github.event_name == 'push' &&
          (
            github.ref == 'refs/heads/main' ||
            startsWith(github.ref, 'refs/tags/v')
          )
        )
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Keep tags/history available for setuptools_scm versioning
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: "package.json"
          # setup-node auto-detects npm from the packageManager pin and turns on
          # package-manager caching, which requires a lockfile this repo ignores.
          package-manager-cache: false

      - run: npm install

      - name: Build dist for main TestPyPI (.postN)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          SETUPTOOLS_SCM_OVERRIDES_FOR_FOLIPLUS: '{version_scheme="post-release", local_scheme="no-local-version"}'
        run: make dist

      - name: Build dist for PR/tag (default versioning)
        if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        run: make dist

      - run: pip install dist/*.whl

      - name: Smoke-test the built wheel
        # Render every control against the distribution under test. Install
        # into an isolated target and point PYTHONPATH there so the import
        # cannot resolve to the source checkout instead.
        run: |
          pip install --target ./.wheelcheck dist/*.whl
          PYTHONPATH=./.wheelcheck python script/smoke-wheel.py

      - run: make info

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: dist/

  TestPyPI:
    needs: sdist
    if: >-
      ${{
        github.event_name == 'push' &&
        (
          github.ref == 'refs/heads/main' ||
          startsWith(github.ref, 'refs/tags/v')
        )
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release*
          merge-multiple: true
          path: dist/

      - run: ls dist/ -l

      - uses: pypa/gh-action-pypi-publish@v1.14.0
        with:
          user: __token__
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          verbose: true

  PyPI:
    needs: TestPyPI
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: dist/

      - run: ls dist/ -l

      - uses: pypa/gh-action-pypi-publish@v1.14.0
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          verbose: true

  GitHub:
    needs: sdist
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: dist/

      - run: ls dist/ -l

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref, 'rc') }}
          files: dist/*.tar.gz
