name: release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  sdist-main-testpypi:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    env:
      SETUPTOOLS_SCM_OVERRIDES_FOR_FOLIPLUS: '{"version_scheme":"post-release","local_scheme":"no-local-version"}'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Fetch all history for all tags and branches

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - run: python -m pip install --upgrade build twine
      - run: make dist
      - run: make info

      - uses: actions/upload-artifact@v7
        with:
          name: release-testpypi
          path: dist/

  sdist-tag-release:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Fetch all history for all tags and branches

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - run: python -m pip install --upgrade build twine
      - run: make dist
      - run: make info

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: dist/

  TestPyPI:
    needs: sdist-main-testpypi
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-testpypi
          path: dist/

      - run: ls dist/ -l

      - uses: pypa/gh-action-pypi-publish@v1.14.0
        with:
          user: __token__
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/
          verbose: true

  PyPI:
    needs: sdist-tag-release
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: dist/

      - run: ls dist/ -l

      - uses: pypa/gh-action-pypi-publish@v1.14.0
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          verbose: true

  GitHub:
    needs: sdist-tag-release
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: dist/

      - run: ls dist/ -l

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref, 'rc') }}
          files: dist/*.tar.gz
