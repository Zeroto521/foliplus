name: typed-consumer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── PEP 561 consumer check ──
  # Builds the wheel and runs test_pytyped.py, whose consumer test installs
  # the wheel into a scratch venv and asserts a downstream mypy catches a
  # Literal-bound constructor mismatch (a silent pass means py.typed did not
  # reach the wheel and the package was skipped as untyped). The assertion
  # lives in the pytest suite so it runs with `make test-python` too; this
  # job only supplies the wheel that the test's skip logic needs.
  typed-consumer:
    name: typed-consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history needed for setuptools_scm to derive __version__ from tags.
          fetch-depth: 0
      - uses: ./.github/actions/setup-deps
        with:
          python-version: "3.14"

      - run: uv sync --group test
      - run: uv build
      - run: uv run pytest test/python/test_pytyped.py -q
