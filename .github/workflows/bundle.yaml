name: bundle

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Manual dispatch runs the main-push track (upload-only) from any ref —
  # used to exercise/verify the baseline path before a merge, and to
  # re-upload a baseline on demand.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write # post/update the sticky comment (report job)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── PR track ──
  # Build the PR and the base branch, diff the two, and post the result as a
  # sticky comment. There is no committed baseline — the base branch's own build
  # is the reference, so nothing is ever written back to main. Codecov Bundle
  # Analysis still uploads here (PR increment view), fail-soft so an upload
  # outage cannot block the sticky table, the dual gates, or merge.
  report:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-deps

      - run: npm run build:sonda

      # Build the base branch in a detached worktree and capture its sizes, then
      # diff the PR build against them.
      #
      # The two builds share the PR checkout's node_modules: the base checkout is
      # a clean tree with no lockfile, so its own `npm install` would resolve
      # devDependencies against the live registry and drift from the PR's build.
      # Copying node_modules keeps the toolchain identical in both directions.
      # `-a` (not `-R`): it preserves symlinks and modes across the handoff —
      # node_modules trees are full of both on Linux runners.
      - name: Capture base sizes
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          git worktree add --detach /tmp/base "origin/${{ github.base_ref }}"
          cp -a node_modules /tmp/base/node_modules
          (
            cd /tmp/base
            make build-js
          )
          node script/bundle-size-check.mjs --root=/tmp/base --emit=base-sizes.json
          git worktree remove --force /tmp/base

      # Absolute cap per artifact — the fuse that fires only on tens-of-KB
      # incidents. Runs on the PR build produced by `build:sonda` above; the
      # report step below is what publishes the verdict, so the fuse must
      # land before it.
      - run: node script/bundle-fuse.mjs

      # The report must land on the PR no matter what the verdict is, so it is
      # always published before the gate is evaluated. `check` exits 0 on a
      # threshold breach by design — the table has to reach the PR first — so
      # this step cannot abort the job; `--enforce` in the gate step is what
      # decides.
      - name: Report
        run: |
          # Neither `github.base_sha` nor `HEAD` is the SHA to show. The checkout
          # is detached at the merge commit `merge(main, PR)`, so `HEAD` is a SHA
          # the author never pushed, and `github.base_sha` arrives empty here.
          # Both sides resolve to their remote branch refs, which `checkout`
          # fetched with `+refs/heads/*:refs/remotes/origin/*`: `origin/<base_ref>`
          # is the tree sampled above, `origin/<head_ref>` is the PR branch tip.
          node script/bundle-size-check.mjs \
            --baseline=base-sizes.json \
            --base="$(git rev-parse "origin/${{ github.base_ref }}")" \
            --head="$(git rev-parse "origin/${{ github.head_ref }}")" \
            --report=bundle-report.md

      - uses: actions/upload-artifact@v7
        id: upload
        with:
          name: bundle-treemap
          path: bundle-treemap.html

      # Codecov Bundle Analysis (soft launch). Speaks the bundler-plugin HTTP
      # protocol over the merged metafile `build:sonda` just wrote. Fail-soft
      # on purpose: an upload outage must not block the sticky table, the
      # dual gates, or merge. Token is the same GHA secret the coverage
      # uploads already use — no new plaintext credentials.
      - name: Codecov Bundle Analysis
        continue-on-error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          node script/codecov-bundle-upload.mjs \
            --root=. \
            --metafile=bundle-metafile.json \
            --bundle-name=foliplus

      - name: Link treemap report
        run: |
          {
            echo ""
            echo "[<kbd>&nbsp;📊&nbsp;View treemap report&nbsp;</kbd>](${{ steps.upload.outputs.artifact-url }})"
            echo ""
            echo "_Table = brotli-compressed, banner excluded; treemap = uncompressed._"
          } >> bundle-report.md

      - uses: marocchino/sticky-pull-request-comment@v2
        continue-on-error: true # fork PRs lack comment permission
        with:
          header: bundle-report
          path: bundle-report.md

      # Gate last: the table above already names the offenders, so the failure
      # here adds nothing to the PR and must never keep it from appearing. The
      # verdict is the one the Report step recorded against the same baseline,
      # so this is a re-read of the same numbers, not a re-measure.
      - name: Enforce threshold
        run: |
          node script/bundle-size-check.mjs --baseline=base-sizes.json --enforce

  # ── main-push / manual track ──
  # Land the Codecov bundle baseline so the next PR's increment view diffs
  # against real main numbers instead of an empty base (the 100% illusion).
  # No PR context and no base to capture, so every baseline-dependent step
  # (Capture / Report / sticky comment / Enforce) stays on the report job —
  # none of them may run here and exit non-zero over a missing base-sizes.json.
  # fuse is absolute and still runs. The upload step is hard-fail here: this
  # job's whole purpose is the upload, so a red job means the baseline did
  # not land (do not paper over it with continue-on-error).
  upload:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-deps

      - run: npm run build:sonda

      # Absolute cap per artifact — same fuse as the PR track.
      - run: node script/bundle-fuse.mjs

      - name: Codecov Bundle Analysis
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          node script/codecov-bundle-upload.mjs \
            --root=. \
            --metafile=bundle-metafile.json \
            --bundle-name=foliplus
