name: bundle

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: "package.json"

      - run: npm install
      - run: npm run build:sonda
      - run: npm run size:check

      # Compare this PR's bundles against the base branch's committed baseline and
      # post the diff as a sticky PR comment (updated on every push). The gate
      # above uses the PR's own baseline; this diff is informational.
      - name: Prepare size report vs base
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          git show "origin/${{ github.base_ref }}:bundle-size-baseline.json" > base-baseline.json 2>/dev/null || echo '{"files":{}}' > base-baseline.json
          node script/bundle-size-check.mjs --baseline=base-baseline.json --report=size-report.md || true

      # Upload the sonda treemap (HTML only) so the comment can link to it.
      - name: Upload report
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: bundle-report
          path: bundle-report/

      # Append a link to the uploaded treemap, then post the comment.
      - name: Append report link
        if: github.event_name == 'pull_request'
        run: |
          {
            echo ""
            echo "**Report:** [bundle report](${{ steps.upload.outputs.artifact-url }})"
          } >> size-report.md

      - uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        continue-on-error: true # fork PRs lack comment permission
        with:
          header: bundle-size
          path: size-report.md
