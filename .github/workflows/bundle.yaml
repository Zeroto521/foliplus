name: bundle

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Manual dispatch runs the main-push track (upload-only) from any ref —
  # used to exercise/verify the baseline path before a merge, and to
  # re-upload a baseline on demand.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write # post/update the sticky comment

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job, two tracks. PR events run the full path: build the PR and the
  # base branch, diff the two, and post the result as a sticky comment. main
  # pushes / manual dispatches run upload-only: land the Codecov bundle
  # baseline so the next PR's increment view diffs against real main numbers
  # instead of an empty base (the 100% illusion).
  #
  # Every baseline-dependent step (Capture / Report / sticky comment /
  # Enforce) is gated on `pull_request` — a push has no base to capture and
  # those steps would exit non-zero over a missing base-sizes.json. fuse is
  # absolute and runs on both tracks.
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-deps

      - run: npm run build:sonda

      # PR-only. Build the base branch in a detached worktree and capture its
      # sizes, then diff the PR build against them.
      #
      # The two builds share the PR checkout's node_modules: the base checkout is
      # a clean tree with no lockfile, so its own `npm install` would resolve
      # devDependencies against the live registry and drift from the PR's build.
      # Copying node_modules keeps the toolchain identical in both directions.
      # `-a` (not `-R`): it preserves symlinks and modes across the handoff —
      # node_modules trees are full of both on Linux runners.
      - name: Capture base sizes
        if: ${{ github.event.pull_request }}
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          git worktree add --detach /tmp/base "origin/${{ github.base_ref }}"
          cp -a node_modules /tmp/base/node_modules
          (
            cd /tmp/base
            make build-js
          )
          node script/build/bundle-size-check.mjs --root=/tmp/base --emit=base-sizes.json
          git worktree remove --force /tmp/base

      # Absolute cap per artifact — the fuse that fires only on tens-of-KB
      # incidents. Runs on the build produced by `build:sonda` above; the
      # report step below is what publishes the verdict, so the fuse must
      # land before it.
      - run: node script/build/bundle-fuse.mjs

      # PR-only. The report must land on the PR no matter what the verdict
      # is, so it is always published before the gate is evaluated. `check`
      # exits 0 on a threshold breach by design — the table has to reach the
      # PR first — so this step cannot abort the job; `--enforce` in the gate
      # step is what decides.
      - name: Report
        if: ${{ github.event.pull_request }}
        run: |
          # Neither `github.base_sha` nor `HEAD` is the SHA to show. The checkout
          # is detached at the merge commit `merge(main, PR)`, so `HEAD` is a SHA
          # the author never pushed, and `github.base_sha` arrives empty here.
          # Both sides resolve to their remote branch refs, which `checkout`
          # fetched with `+refs/heads/*:refs/remotes/origin/*`: `origin/<base_ref>`
          # is the tree sampled above, `origin/<head_ref>` is the PR branch tip.
          node script/build/bundle-size-check.mjs \
            --baseline=base-sizes.json \
            --base="$(git rev-parse "origin/${{ github.base_ref }}")" \
            --head="$(git rev-parse "origin/${{ github.head_ref }}")" \
            --report=bundle-report.md

      - uses: actions/upload-artifact@v7
        if: ${{ github.event.pull_request }}
        id: upload
        with:
          name: bundle-treemap
          path: bundle-treemap.html

      # Both tracks. Speaks the bundler-plugin HTTP protocol over the merged
      # metafile `build:sonda` just wrote. On a PR this supplies the increment
      # view; a main push lands the baseline that PRs diff against. PR uploads
      # stay fail-soft (an outage must not block the sticky table, the dual
      # gates, or merge); a main-push upload is hard-fail — the whole point of
      # that track is landing the baseline, so a red job means it did not land
      # (do not paper it over). Token is the same GHA secret the coverage
      # uploads already use — no new plaintext credentials.
      - name: Codecov Bundle Analysis
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          node script/build/codecov-bundle-upload.mjs \
            --root=. \
            --metafile=bundle-metafile.json \
            --bundle-name=foliplus

      - name: Link treemap report
        if: ${{ github.event.pull_request }}
        run: |
          {
            echo ""
            echo "[<kbd>&nbsp;📊&nbsp;View treemap report&nbsp;</kbd>](${{ steps.upload.outputs.artifact-url }})"
            echo ""
            echo "_Table = brotli-compressed, banner excluded; treemap = uncompressed._"
          } >> bundle-report.md

      - uses: marocchino/sticky-pull-request-comment@v2
        if: ${{ github.event.pull_request }}
        continue-on-error: true # fork PRs lack comment permission
        with:
          header: bundle-report
          path: bundle-report.md

      # PR-only. Gate last: the table above already names the offenders, so the
      # failure here adds nothing to the PR and must never keep it from
      # appearing. The verdict is the one the Report step recorded against the
      # same baseline, so this is a re-read of the same numbers, not a
      # re-measure. A push has no base to enforce against, hence the gate.
      - name: Enforce threshold
        if: ${{ github.event.pull_request }}
        run: |
          node script/build/bundle-size-check.mjs --baseline=base-sizes.json --enforce
