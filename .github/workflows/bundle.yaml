name: bundle

on:
  push:
    branches: [main]
    # The bot's baseline commit must not re-trigger this workflow.
    paths-ignore:
      - bundle-size-baseline.json
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PR: build, compare against main's committed baseline, and post the diff as a
  # sticky comment. Read-only — the baseline is never written on a PR push, so
  # the "standard" stays anchored to main until the PR actually merges.
  report:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # post/update the sticky comment
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: "package.json"

      - run: npm install
      - run: npm run build:sonda

      - name: Compare bundles vs base
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          # First PR to introduce the baseline: main has nothing to diff against,
          # so post a note instead of a misleading "all new" table.
          if git show "origin/${{ github.base_ref }}:bundle-size-baseline.json" > base-baseline.json 2>/dev/null; then
            node script/bundle-size-check.mjs --baseline=base-baseline.json --report=bundle-report.md || true
          else
            {
              echo "## Bundle Size"
              echo ""
              echo "**No baseline on main yet** — this is the first PR to introduce bundle-size tracking. Bundle sizes will be diffed against main from the next PR onward."
            } > bundle-report.md
          fi

      # Upload the sonda treemap (HTML only) so the comment can link to it.
      - uses: actions/upload-artifact@v7
        id: upload
        with:
          name: bundle-treemap
          path: bundle-treemap.html

      - name: Link treemap report
        run: |
          {
            echo ""
            echo "[<kbd>&nbsp;📊&nbsp;View treemap report&nbsp;</kbd>](${{ steps.upload.outputs.artifact-url }})"
            echo ""
            echo "_Table above = brotli-compressed sizes; treemap = uncompressed._"
          } >> bundle-report.md

      - uses: marocchino/sticky-pull-request-comment@v2
        continue-on-error: true # fork PRs lack comment permission
        with:
          header: bundle-report
          path: bundle-report.md

  # Main: refresh the canonical baseline once per merge so the standard tracks
  # main's actual bundle sizes. The bot commits straight to main.
  baseline:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the refreshed baseline to main
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: "package.json"

      - run: npm install
      - run: npm run build
      - run: npm run bundle-size:save

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update bundle-size-baseline.json"
          file_pattern: bundle-size-baseline.json
