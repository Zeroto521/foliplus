name: Change scope
description: >-
  Classify the pull request diff so a documentation-only change does not run the
  test suites. Only a diff that touches nothing but documentation is skipped:
  the JS and Python halves are coupled (the Python suite asserts on the built
  JS/CSS, and the JS guards read the Python-emitted config schema), so any code
  change runs both. A push or a merge-group run always reports code as changed.

outputs:
  code:
    description: >-
      A non-documentation file changed. False only when every changed path is
      documentation or Markdown.
    value: ${{ steps.scope.outputs.code }}
  docs:
    description: Documentation or Markdown changed.
    value: ${{ steps.scope.outputs.docs }}

runs:
  using: composite
  steps:
    - id: scope
      shell: bash
      run: |
        set -euo pipefail
        if [ "${{ github.event_name }}" != "pull_request" ]; then
          printf 'code=true\ndocs=true\n' >> "$GITHUB_OUTPUT"
          exit 0
        fi
        base="${{ github.event.pull_request.base.sha }}"
        # The default checkout is depth 1, so the base commit has to be fetched
        # before it can be diffed against.
        git fetch --no-tags --depth=1 origin "$base" >/dev/null 2>&1 || true
        files=$(git diff --name-only "$base" HEAD)
        code=false
        docs=false
        while IFS= read -r f; do
          [ -z "$f" ] && continue
          case "$f" in
            doc/*|*.md)
              docs=true ;;
            *)
              code=true ;;
          esac
        done <<< "$files"
        printf 'code=%s\ndocs=%s\n' "$code" "$docs" >> "$GITHUB_OUTPUT"
