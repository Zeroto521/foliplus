[build-system]
requires = ["setuptools", "setuptools_scm[toml]"]
build-backend = "setuptools.build_meta"

[project]
name = "foliplus"
dynamic = ["version"]
description = 'foliplus: the missing piece between "see the map" and "use the map".'
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "40% <@Zeroto521>", email = "Zeroto521@gmail.com" }]
license = { text = "MIT" }
keywords = ["folium", "leaflet", "gis", "map", "visualization"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering :: Visualization",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
]
dependencies = ["folium>=0.14.0"]

[project.urls]
Documentation = "https://foliplus.readthedocs.io"
Source = "https://github.com/Zeroto521/foliplus"
Issues = "https://github.com/Zeroto521/foliplus/issues"

[dependency-groups]
test = ["pytest", "pytest-cov", "pytest-xdist", "pytest-playwright", "codecov"]
doc = [
  "sphinx",
  "pydata-sphinx-theme",
  "myst-nb",
  "sphinx-copybutton",
  "sphinx-design",
  "geopandas",
  "my-data-toolkit",
  "matplotlib",
  "mapclassify",
]
dev = [{ include-group = "test" }, { include-group = "doc" }, "build", "twine"]

[tool.setuptools_scm]
write_to = "foliplus/_version.py"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["foliplus*"]

[tool.setuptools.package-data]
foliplus = ["cdn.json", "locale/*.json", "dist/*.min.js", "dist/*.min.css"]

[tool.pytest.ini_options]
testpaths = ["test/python"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --cov=foliplus --cov-report=term-missing"
markers = [
  "browser: marks tests that require a Playwright browser (e.g., Browser test classes)",
]

[tool.ruff]
line-length = 88
fix = true

[tool.ruff.lint]
select = ["I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["foliplus"]

[tool.coverage.run]
source = ["foliplus"]
branch = true

[tool.coverage.report]
ignore_errors = false
show_missing = true
# Regexes for lines to exclude from consideration
exclude_lines = [
  # Have to re-enable the standard pragma
  "pragma: no cover",
  # Don't complain about missing debug-only code
  "def __repr__",
  "if self.debug",
  # Don't complain if tests don't hit defensive assertion code:
  "raise AssertionError",
  "raise NotImplementedError",
  "AbstractMethodError",
  # Don't complain if non-runnable code isn't run:
  "if 0:",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
omit = ["*/test/*", "*/site-packages/*"]

[tool.codespell]
ignore-words-list = "afterAll"
