[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "foliplus"
dynamic = ["version"]
description = "foliplus is a pragmatic Folium toolkit built to streamline spatial data visualization workflows, allowing you to focus entirely on the data itself."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Zeroto521" }]
license = { text = "MIT" }
keywords = ["folium", "leaflet", "gis", "map", "visualization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Visualization",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
]
dependencies = ["folium>=0.14.0", "jinja2>=3.0.0"]

[project.urls]
Homepage = "https://github.com/Zeroto521/foliplus"
Issues = "https://github.com/Zeroto521/foliplus/issues"
Source = "https://github.com/Zeroto521/foliplus"
Documentation = "https://github.com/Zeroto521/foliplus#readme"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "build>=1.0", "twine>=4.0"]
doc = [
    "sphinx>=8.0",
    "pydata-sphinx-theme>=0.16",
    "myst-nb>=1.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=2.0",
]

[tool.setuptools.dynamic]
version = { attr = "foliplus.__version__" }

[tool.setuptools.packages.find]
include = ["foliplus*"]

[tool.setuptools.package-data]
foliplus = ["js/*.js", "css/*.css", "locale/*.json"]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --cov=foliplus --cov-report=term-missing"

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["UP"]
