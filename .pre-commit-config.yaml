ci:
  autofix_commit_msg: |
    BOT: auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autoupdate_commit_msg: "BOT: pre-commit hooks autoupdate"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    # ── File & Syntax checks ──
    hooks:
      - id: check-ast # Python AST validation
      - id: check-yaml # YAML syntax
      - id: check-toml # TOML syntax
      - id: check-merge-conflict # No unresolved merge markers
      - id: check-case-conflict # No case-insensitive filename clashes
      - id: check-added-large-files # No accidental large file commits
      - id: detect-private-key # No leaked private keys
      - id: check-builtin-literals # No `set()` / `list()` → `{}` / `[]`

      # ── Formatting fixes ──
      - id: end-of-file-fixer # File ends with newline
      - id: trailing-whitespace # No trailing spaces

  # ── Lint & Format (ruff) ──
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # ── Python type checking ──
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        additional_dependencies: [folium, jinja2]
        args: [--ignore-missing-imports, foliplus]
        pass_filenames: false

  # ── Spell check ──
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell

  # ── JS / CSS formatting ──
  # Prettier runs in GitHub Actions (the `format` job in test.yaml), not here.
  # Keeping it in pre-commit as well would mean two version declarations —
  # `additional_dependencies` pinning prettier here and `devDependencies` in
  # package.json on the CI side — which drift: a caret range in package.json
  # resolves to a newer patch than this static list, and the two runtimes end
  # up formatting the same commit with different prettier versions. Same story
  # as ESLint (which moved out for a different reason — its config imports
  # packages that pre-commit.ci installs under NODE_PATH, which neither the ESM
  # nor the CJS resolver consults by package name). Every hook left here is
  # self-contained in its isolated env; Prettier is the only one whose config
  # reads a project file, so it belongs with the other project-Node tools.
