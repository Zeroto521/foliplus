ci:
  autofix_commit_msg: |
    BOT: auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autoupdate_commit_msg: "BOT: pre-commit hooks autoupdate"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    # ── File & Syntax checks ──
    hooks:
      - id: check-ast # Python AST validation
      - id: check-yaml # YAML syntax
      - id: check-toml # TOML syntax
      - id: check-merge-conflict # No unresolved merge markers
      - id: check-case-conflict # No case-insensitive filename clashes
      - id: check-added-large-files # No accidental large file commits
      - id: detect-private-key # No leaked private keys
      - id: check-builtin-literals # No `set()` / `list()` → `{}` / `[]`

      # ── Formatting fixes ──
      - id: end-of-file-fixer # File ends with newline
      - id: trailing-whitespace # No trailing spaces

  # ── Lint & Format (ruff) ──
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # ── Python type checking ──
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        additional_dependencies: [folium, jinja2]
        args: [--ignore-missing-imports, foliplus]
        pass_filenames: false

  # ── Spell check ──
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell

  # ── TypeScript type checking ──
  # Uses language: node so pre-commit.ci installs TypeScript itself (its
  # isolated env has no node_modules). Keep the version in sync with the
  # typescript devDependency in package.json.
  - repo: local
    hooks:
      - id: typecheck
        name: typecheck
        entry: tsc --noEmit
        language: node
        pass_filenames: false
        additional_dependencies:
          - "typescript@7.0.2"

  # ── JS / CSS formatting (Prettier) ──
  # Uses language: node so pre-commit.ci sets up Node and installs prettier
  # itself (its isolated env has no npx/node_modules).
  #
  # Uses .prettierrc.cjs (with require.resolve for the plugin) because
  # prettier resolves plugins from package.json's "prettier" block via
  # ESM `import()` from /code/noop.js — which fails in pre-commit.ci's
  # isolated env (ESM does not honor NODE_PATH). require.resolve() in a
  # .cjs file resolves via CJS module resolution, which honors NODE_PATH.
  - repo: local
    hooks:
      - id: format-prettier
        name: format-prettier
        entry: prettier --write
        language: node
        types_or: [css, javascript, ts]
        files: ^foliplus/(js|css)/|^script/.*\.(js|cjs|mjs|ts)$|^test/js/.*\.(js|cjs|mjs|ts)$
        additional_dependencies:
          - "prettier@3.9.5"
          - "@trivago/prettier-plugin-sort-imports@5.2.2"
