ci:
  autofix_commit_msg: |
    BOT: auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autoupdate_commit_msg: "BOT: pre-commit hooks autoupdate"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    # ── File & Syntax checks ──
    hooks:
      - id: check-ast # Python AST validation
      - id: check-yaml # YAML syntax
      - id: check-toml # TOML syntax
      - id: check-merge-conflict # No unresolved merge markers
      - id: check-case-conflict # No case-insensitive filename clashes
      - id: check-added-large-files # No accidental large file commits
      - id: detect-private-key # No leaked private keys
      - id: check-builtin-literals # No `set()` / `list()` → `{}` / `[]`

      # ── Formatting fixes ──
      - id: end-of-file-fixer # File ends with newline
      - id: trailing-whitespace # No trailing spaces

  # ── Lint & Format (ruff) ──
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # ── Python type checking ──
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        additional_dependencies: [folium, jinja2]
        args: [--ignore-missing-imports, foliplus]
        pass_filenames: false

  # ── Spell check ──
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell

  # ── JS / CSS formatting (Prettier) ──
  # The only JS tool left in pre-commit: it needs neither the typescript-eslint
  # parser plugin nor type information, so it runs in pre-commit.ci's isolated
  # env. ESLint moved to GitHub Actions (the `lint` / `typecheck` jobs) because
  # its config imports packages that pre-commit.ci installs under NODE_PATH,
  # which neither the ESM nor the CJS resolver consults by package name.
  #
  # `--check`, not `--write`: CI asserts on formatting rather than mutating a
  # working tree. Local `npm run format` writes.
  #
  # Uses .prettierrc.cjs so the same config serves local and pre-commit.ci. The
  # CJS file resolves the plugin to an absolute path, which is the only form
  # that works there: prettier never asks for the plugin by name, so it never
  # hits NODE_PATH package-name resolution. A bare `import`/`require()` would
  # fail in the isolated env just the same.
  - repo: local
    hooks:
      - id: format-prettier
        name: format-prettier
        entry: prettier --check
        language: node
        types_or: [css, javascript, ts]
        files: ^foliplus/(js|css)/|^script/.*\.(js|cjs|mjs|ts)$|^test/js/.*\.(js|cjs|mjs|ts)$
        additional_dependencies:
          - "prettier@3.9.5"
          - "@trivago/prettier-plugin-sort-imports@5.2.2"
