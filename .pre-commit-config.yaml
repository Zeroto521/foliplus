ci:
  autofix_commit_msg: |
    BOT: auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autoupdate_commit_msg: "BOT: pre-commit hooks autoupdate"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    # ── File & Syntax checks ──
    hooks:
      - id: check-ast # Python AST validation
      - id: check-yaml # YAML syntax
      - id: check-toml # TOML syntax
      - id: check-merge-conflict # No unresolved merge markers
      - id: check-case-conflict # No case-insensitive filename clashes
      - id: check-added-large-files # No accidental large file commits
      - id: detect-private-key # No leaked private keys
      - id: check-builtin-literals # No `set()` / `list()` → `{}` / `[]`

      # ── Formatting fixes ──
      - id: end-of-file-fixer # File ends with newline
      - id: trailing-whitespace # No trailing spaces

  # ── Lint & Format (ruff) ──
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # ── Python type checking ──
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        additional_dependencies: [folium, jinja2]
        args: [--ignore-missing-imports, foliplus]
        pass_filenames: false

  # ── Spell check ──
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell

  # ── JS / Jinja2 formatting (custom script) ──
  - repo: local
    hooks:
      - id: format-jinja-js
        name: format-jinja-js
        entry: node script/format_jinja_js.js
        language: node
        types_or: [javascript]
        files: ^foliplus/js/
        pass_filenames: false
        additional_dependencies: [prettier]
