ci:
  autofix_commit_msg: |
    BOT: auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autoupdate_commit_msg: "BOT: pre-commit hooks autoupdate"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    # ── File & Syntax checks ──
    hooks:
      - id: check-ast # Python AST validation
      - id: check-yaml # YAML syntax
      - id: check-toml # TOML syntax
      - id: check-merge-conflict # No unresolved merge markers
      - id: check-case-conflict # No case-insensitive filename clashes
      - id: check-added-large-files # No accidental large file commits
      - id: detect-private-key # No leaked private keys
      - id: check-builtin-literals # No `set()` / `list()` → `{}` / `[]`

      # ── Formatting fixes ──
      - id: end-of-file-fixer # File ends with newline
      - id: trailing-whitespace # No trailing spaces

  # ── Lint & Format (ruff) ──
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # ── Python type checking ──
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        additional_dependencies: [folium, jinja2]
        args: [--ignore-missing-imports, foliplus]
        pass_filenames: false

  # ── Spell check ──
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell

  # ── Repo-local checks ──
  # --fix mode: auto-reorder PR numbers within bullets and reorder bullets
  # within a subsection by first-number. Stable sort — ties (the #122×4 /
  # #147×4 / #37×2 / #48×3 mega-PR sibling groups) keep their relative
  # order. Two invariants gate the fix:
  #   - only adjacent ", "-separated label pairs are reordered
  #   - the normalized line multiset is unchanged
  # If either invariant would fail, the hook refuses to write.
  # Existence check is skipped here — pre-commit.ci does not carry a
  # GITHUB_TOKEN, and the check needs one. GitHub CI re-runs the same
  # script in --check mode so the existence check gets enforced there.
  - repo: local
    hooks:
      - id: changelog-order
        entry: python script/changelog_check.py --fix --skip-exists
        files: ^CHANGELOG\.md$
        pass_filenames: false
