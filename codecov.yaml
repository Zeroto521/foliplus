coverage:
  precision: 2
  round: down
  status:
    project:
      default:
        target: 95%
        threshold: 2%
    patch:
      default:
        target: 95%

# Soft launch (T243): report and comment only, never block a PR. Tighten
# targets/thresholds (and drop informational) after the upload path has
# proven stable across a few PRs.
bundle_analysis:
  status:
    project:
      default:
        informational: true
        target: auto
        threshold: 5%
    patch:
      default:
        informational: true

comment:
  layout: "header, diff, files"
  behavior: default
