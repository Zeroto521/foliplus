coverage:
  precision: 2
  round: down
  # Only the shipped package and the TS sources it bundles are measured: the
  # pytest run collects foliplus/, the vitest run collects foliplus/js/. Test
  # trees, browser probes, stylesheets and the docs are executed or rendered,
  # so a PR that only touches them must not be scored as "0% patch coverage".
  # Stylesheets are rendered, never collected: the vitest run scopes coverage to
  # foliplus/js/**, so a PR that touches only CSS (a token or rule move) has no
  # coverage data for those lines and would be scored as uncovered patch.
  ignore:
    - "foliplus/css/**"
    - "test/**"
    - "doc/**"
  status:
    project:
      default:
        target: 95%
        threshold: 2%
    patch:
      default:
        target: 95%

# Soft launch (T243): report and comment only, never block a PR. Tighten
# targets/thresholds (and drop informational) after the upload path has
# proven stable across a few PRs.
bundle_analysis:
  status:
    project:
      default:
        informational: true
        target: auto
        threshold: 5%
    patch:
      default:
        informational: true

comment:
  layout: "header, diff, files"
  behavior: default
