# Read the Docs configuration
# https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-lts-latest
  tools:
    nodejs: "24"
    python: "3.14"
  jobs:
    post_checkout:
      - git fetch --unshallow || true
      - git fetch origin --tags --force
    pre_install:
      # Python-free, so it can run before the install step lands.
      - npm install
    post_install:
      # `make build-js` dumps the CONFIG schema by importing the package, so
      # the install step above must have run first — CI's `js` job does
      # `uv sync --no-dev` before building for the same reason.
      - make build-js
      - uv run make info

sphinx:
  configuration: doc/source/conf.py
  builder: html
  fail_on_warning: false

python:
  install:
    - method: uv
      command: sync
      groups: [doc]
