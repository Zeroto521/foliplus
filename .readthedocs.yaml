# Read the Docs configuration
# https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-lts-latest
  tools:
    nodejs: "24"
    # Read the Docs does not honour the uv lock on a fresh resolve: on 3.14
    # (which removed `types.Union`) a free resolve falls back to sphinx 3.x and
    # the docs build dies with `cannot import name 'Union' from 'types'`.
    # 3.12 is the oldest supported stable; CI's py3.15 job still covers 3.15.
    python: "3.12"
  jobs:
    post_checkout:
      - git fetch --unshallow || true
      - git fetch origin --tags --force
    pre_install:
      # Build bundled JS/CSS assets (foliplus/dist/) before Python install.
      - npm install
      - make build-js
    post_install:
      - uv run make info

sphinx:
  configuration: doc/source/conf.py
  builder: html
  fail_on_warning: false

python:
  install:
    - method: uv
      command: sync
      groups: [doc]
