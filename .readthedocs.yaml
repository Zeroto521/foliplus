# Read the Docs configuration
# https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-lts-latest
  tools:
    nodejs: "24"
    # Read the Docs' asdf toolchain has no 3.15 yet (the build fails while
    # resolving the version). CI's py3.15 job covers 3.15; bump this when
    # Read the Docs ships it.
    python: "3.14"
  jobs:
    post_checkout:
      - git fetch --unshallow || true
      - git fetch origin --tags --force
    pre_install:
      # Build bundled JS/CSS assets (foliplus/dist/) before Python install.
      - npm install
      - make build-js
    post_install:
      - uv run make info

sphinx:
  configuration: doc/source/conf.py
  builder: html
  fail_on_warning: false

python:
  install:
    - method: uv
      command: sync
      groups: [doc]
