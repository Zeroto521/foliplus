# Read the Docs configuration
# https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-lts-latest
  tools:
    nodejs: "24"
    python: "3.13"
  jobs:
    post_checkout:
      - git fetch --unshallow || true
      - git fetch origin --tags --force
    pre_install:
      # Build bundled JS/CSS assets (foliplus/dist/) before Python install.
      - npm install
      - make build-js
      - python -m pip install --upgrade uv

sphinx:
  configuration: doc/source/conf.py
  builder: html
  fail_on_warning: false

python:
  # Install foliplus + docs deps directly into RTD's Python 3.13 environment
  # using uv. --system tells uv to install into the interpreter running it
  # (RTD's env), not a fresh .venv.
  install:
    - method: command
      path: .
      command: uv pip install --system -e ".[docs]"
