version: 2

build:
  os: ubuntu-lts-latest
  tools:
    python: "mambaforge-latest"

sphinx:
  configuration: doc/source/conf.py
  builder: html
  fail_on_warning: false

conda:
  environment: ci/env/latest.yaml

python:
  install:
    - method: pip
      path: .
